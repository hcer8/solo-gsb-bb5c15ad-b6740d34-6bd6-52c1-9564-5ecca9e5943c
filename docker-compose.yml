services:
  redact:
    build: .
    image: json-redact:latest
    ports:
      - "8080:8080"
    environment:
      # Override in a .env file or your shell for a real deployment.
      REDACT_SALT: "${REDACT_SALT:-}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
